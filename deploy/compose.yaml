# Production stack. Lives in /srv/boilerplate on the server, next to the .env file
# created by deploy/scripts/provision.sh. Updated by the "Deploy" GitHub workflow.

name: boilerplate

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/saltydreamer/boilerplate:latest}
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/app/storage
  depends_on:
    mariadb:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: web
      SERVER_NAME: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config

  worker:
    <<: *app
    environment:
      CONTAINER_ROLE: worker
    # The image healthcheck probes the web server, which only runs in "app".
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_grace_period: 60s

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
    # The image healthcheck probes the web server, which only runs in "app".
    healthcheck:
      disable: true
    command: ["php", "artisan", "schedule:work"]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage:
  mariadb:
  caddy_data:
  caddy_config:
