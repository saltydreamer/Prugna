name: Server check

# Read-only inspection of the VPS (OS, resources, Docker, used ports).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

      - name: Inspect server
        run: ssh vps 'bash -s' < deploy/scripts/server-check.sh

      - name: Check public site
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'dev.reimg.it' }}
        run: |
          echo "DNS (A): $(getent ahostsv4 "$APP_DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "DNS (AAAA): $(getent ahostsv6 "$APP_DOMAIN" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          curl -sS -o /dev/null -w 'http://  → %{http_code} %{redirect_url}\n' "http://$APP_DOMAIN/" || true
          curl -sS -o /dev/null -w 'https:// → %{http_code} %{redirect_url}\n' "https://$APP_DOMAIN/" || true
          curl -sS -o /dev/null -w 'https:///login → %{http_code}\n' "https://$APP_DOMAIN/login" || true
