name: Deploy

# main → tests → Docker image (GHCR) → smoke test of the full stack → deploy to the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'dev.reimg.it' }}
  APP_NAME: ${{ vars.APP_NAME || 'Prugna' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    name: Build image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repo=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same files and script used on the server, with plain HTTP on port 80.
      - name: Start the stack with deploy.sh
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          mkdir -p /tmp/stack
          cp deploy/compose.yaml deploy/scripts/deploy.sh /tmp/stack/
          cat > /tmp/stack/.env <<ENV
          APP_NAME=Prugna
          APP_ENV=production
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=false
          APP_DOMAIN=:80
          APP_URL=http://localhost
          APP_ADMIN_EMAIL=admin@example.com
          APP_LOCALE=it
          LOG_CHANNEL=stderr
          DB_CONNECTION=mariadb
          DB_HOST=mariadb
          DB_PORT=3306
          DB_DATABASE=boilerplate
          DB_USERNAME=boilerplate
          DB_PASSWORD=smoke-password
          DB_ROOT_PASSWORD=smoke-root-password
          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=database
          MAIL_MAILER=log
          FORTIFY_REGISTRATION=false
          INERTIA_SSR_ENABLED=false
          ENV
          sed -i 's/^ *//' /tmp/stack/.env
          # The workflow-level APP_DOMAIN would override the test .env (plain HTTP on :80).
          unset APP_DOMAIN
          bash /tmp/stack/deploy.sh

      - name: Check HTTP endpoints
        run: |
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost/up && break; sleep 2; done
          curl -fsS http://localhost/up > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login)" = 200
          curl -fsS http://localhost/login | grep -q 'data-page="app"'
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost/dashboard)" = "http://localhost/login"
          curl -fsS -o /dev/null http://localhost/build/manifest.json || true
          echo "Smoke test OK"

      - name: Check background services
        working-directory: /tmp/stack
        run: |
          unset APP_DOMAIN
          docker compose ps
          for service in app worker scheduler mariadb; do
            state="$(docker compose ps --format '{{.State}}' "$service")"
            echo "$service: $state"
            test "$state" = running
          done
          docker compose exec -T app php artisan about --only=environment,drivers
          # PDF generation (dompdf, fonts, € and accented characters) inside the production image.
          docker compose exec -T app php <<'PHP' | tee /tmp/pdf.txt
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $pdf = Barryvdh\DomPDF\Facade\Pdf::loadHTML('<p>Preventivo € 1.234,56 – àèìòù</p>')->output();
          echo strlen($pdf) > 1000 ? "PDF OK\n" : "PDF FAIL\n";
          PHP
          grep -q "PDF OK" /tmp/pdf.txt
          docker compose exec -T app php artisan schedule:list
          # The Dolibarr import reads backups into a SQLite staging database.
          docker compose exec -T app php -m | grep -qi pdo_sqlite

      - name: Logs on failure
        if: failure()
        working-directory: /tmp/stack
        run: |
          unset APP_DOMAIN
          docker compose logs --tail=200

  deploy:
    name: Deploy to VPS
    # Only one job at a time may change the server.
    concurrency:
      group: vps
      cancel-in-progress: false
    needs: [image, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: dev
      url: https://${{ vars.APP_DOMAIN || 'dev.reimg.it' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: deploy
          key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload stack files
        run: |
          ssh vps 'test -f /srv/boilerplate/.env' || { echo "::error::Server non preparato: esegui prima il workflow 'Provision server'."; exit 1; }
          scp -q deploy/compose.yaml deploy/scripts/deploy.sh deploy/scripts/backup.sh vps:/srv/boilerplate/
          ssh vps 'chmod +x /srv/boilerplate/deploy.sh /srv/boilerplate/backup.sh'

      - name: Deploy
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh vps "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin > /dev/null"
          ssh vps "APP_IMAGE='$APP_IMAGE' APP_NAME='$APP_NAME' /srv/boilerplate/deploy.sh" || { ssh vps 'docker logout ghcr.io > /dev/null'; exit 1; }
          ssh vps 'docker logout ghcr.io > /dev/null'

      - name: Verify https://${{ env.APP_DOMAIN }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null "https://$APP_DOMAIN/up"; then echo "Online: https://$APP_DOMAIN"; exit 0; fi
            sleep 5
          done
          echo "::error::https://$APP_DOMAIN non risponde. Controlla che il record DNS A punti al VPS (il certificato HTTPS viene emesso solo dopo)."
          exit 1

  deploy-internal:
    name: Deploy to the internal server
    # Turned on with the repository variable INTERNAL_DEPLOY=true once the runner is installed
    # (deploy/README.md, "Server interno"): until then no job waits for a missing runner.
    if: vars.INTERNAL_DEPLOY == 'true'
    concurrency:
      group: internal
      cancel-in-progress: false
    needs: [image, smoke]
    runs-on: [self-hosted, prugna]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.INTERNAL_DOMAIN || 'prugna.reimg.it' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update stack files
        run: |
          test -f /srv/boilerplate/.env || { echo "::error::Server interno non preparato: esegui provision.sh con INTERNAL=1 (deploy/README.md)."; exit 1; }
          cp deploy/compose.yaml deploy/scripts/deploy.sh deploy/scripts/backup.sh deploy/scripts/restore.sh /srv/boilerplate/
          chmod +x /srv/boilerplate/deploy.sh /srv/boilerplate/backup.sh /srv/boilerplate/restore.sh

      - name: Deploy
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The workflow-level APP_DOMAIN is the demo's: Compose must read this server's own .env.
          unset APP_DOMAIN
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin > /dev/null
          APP_IMAGE="$APP_IMAGE" APP_NAME="$APP_NAME" /srv/boilerplate/deploy.sh || { docker logout ghcr.io > /dev/null; exit 1; }
          docker logout ghcr.io > /dev/null

      - name: Verify
        env:
          INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'prugna.reimg.it' }}
        run: |
          for i in $(seq 1 24); do
            curl -fsS -o /dev/null http://localhost/up && break
            sleep 5
          done
          curl -fsS -o /dev/null http://localhost/up || { echo "::error::L'app non risponde sul server interno (http://localhost/up)."; exit 1; }
          if curl -fsS -o /dev/null "https://$INTERNAL_DOMAIN/up"; then
            echo "Online: https://$INTERNAL_DOMAIN"
          else
            echo "::warning::L'app risponde sul server interno ma https://$INTERNAL_DOMAIN no: controlla il reverse proxy e il record DNS."
          fi
