name: Reset demo

# Turns dev.reimg.it into the demonstration instance: it ERASES its data (after a backup) and fills it
# with three years of work of a fictitious freelance system administrator (php artisan app:demo-seed).
# Run it only once the real data live on the internal server (workflow "Copy data to the internal
# server") and the SDI is connected from there (Impostazioni → Fatturazione elettronica → «Collega»).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Scrivi AZZERA per cancellare i dati di dev.reimg.it e caricare la demo
        required: true

permissions:
  contents: read

env:
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'dev.reimg.it' }}
  INTERNAL_DOMAIN: ${{ vars.INTERNAL_DOMAIN || 'prugna.reimg.it' }}

jobs:
  reset:
    name: Reset demo data
    concurrency:
      group: vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: https://${{ vars.APP_DOMAIN || 'dev.reimg.it' }}

    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "AZZERA" || { echo "::error::Conferma mancante: scrivi AZZERA."; exit 1; }

      - name: The real data are on the internal server
        run: |
          # Never erase dev.reimg.it while the internal server is not online.
          curl -fsS -o /dev/null "https://$INTERNAL_DOMAIN/up" || { echo "::error::https://$INTERNAL_DOMAIN non risponde: prima porta i dati sul server interno."; exit 1; }
          echo "https://$INTERNAL_DOMAIN è online."

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: deploy
          key: ${{ secrets.VPS_SSH_KEY }}

      - name: Backup before erasing
        run: ssh vps '/srv/boilerplate/backup.sh'

      - name: Demo data
        run: |
          # Uploaded and run as a file: fed through stdin ('bash -s'), the first `docker compose exec`
          # read the rest of the script and nothing after maintenance mode ran.
          ssh vps 'cat > /srv/boilerplate/demo-reset.sh && chmod +x /srv/boilerplate/demo-reset.sh' < deploy/scripts/demo-reset.sh
          ssh -n vps '/srv/boilerplate/demo-reset.sh' | tee demo-reset.log
          grep -q '^Demo data loaded\.$' demo-reset.log || { echo "::error::Lo script della demo non è arrivato in fondo."; exit 1; }

      - name: Verify
        run: |
          for i in $(seq 1 24); do curl -fsS -o /dev/null "https://$APP_DOMAIN/up" && break; sleep 5; done
          # The page props carry the demo account only with APP_DEMO=true.
          curl -fsS "https://$APP_DOMAIN/login" | grep -q 'demo@prugna.it' || { echo "::error::La pagina di accesso non mostra l'account demo."; exit 1; }
          echo "Demo online: https://$APP_DOMAIN (demo@prugna.it / prugna-demo)"
